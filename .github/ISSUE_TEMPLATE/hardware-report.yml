name: 真机验收报告
description: 提交 MeowFace 模块的实际设备验收结果
title: "[验证] "
labels: ["verification"]
body:
  - type: input
    id: phone
    attributes:
      label: 手机型号与系统
      description: 例如 iPhone 13 / iOS 18.2、Pixel 8 / Android 15
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: MeowFace 版本
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: FaceGaze Bridge 版本
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: 模块版本（Release tag）
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 结果
      options:
        - 全部正常
        - 部分形状不对
        - 极化/左右反了
        - 连不上
        - 崩溃
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 现象描述
      description: 哪些表情不动、数值方向是否反了、模块卡片显示什么
    validations:
      required: true
